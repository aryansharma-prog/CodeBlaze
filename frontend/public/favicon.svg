<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#161a29" />
      <stop offset="100%" stopColor="#0a0b0e" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#6c8ef7" />
      <stop offset="50%" stopColor="#a855f7" />
      <stop offset="100%" stopColor="#f43f5e" />
    </linearGradient>

    <!-- Left Bracket `<` -->
    <linearGradient id="bracket-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#60a5fa" />
      <stop offset="100%" stopColor="#6366f1" />
    </linearGradient>

    <!-- Right Bracket `>` -->
    <linearGradient id="bracket-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#a855f7" />
      <stop offset="100%" stopColor="#ec4899" />
    </linearGradient>

    <!-- Flame Core Gradient -->
    <linearGradient id="flame-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="35%" stopColor="#f59e0b" />
      <stop offset="70%" stopColor="#f43f5e" />
      <stop offset="100%" stopColor="#a855f7" />
    </linearGradient>

    <!-- Inner Flame Core -->
    <linearGradient id="inner-flame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="50%" stopColor="#fde047" />
      <stop offset="100%" stopColor="#f97316" />
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2.5"/>

  <!-- Left Bracket `<` -->
  <path d="M17 20L7 32L17 44" stroke="url(#bracket-left)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Bracket `>` -->
  <path d="M47 20L57 32L47 44" stroke="url(#bracket-right)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Outer Blaze Flame -->
  <path d="M32 8C34.4 15 41 20 41 30C41 38 36.4 43 32 44C27.6 43 23 38 23 30C23 23.6 27 18 29 15C29.6 20 32 23 33 23C34 23 33 16 32 8Z" fill="url(#flame-grad)"/>

  <!-- Inner Fiery Spark -->
  <path d="M32 26C33.6 29.6 36.4 32.4 36.4 36.4C36.4 40.4 34.4 42.4 32 43C29.6 42.4 27.6 40.4 27.6 36.4C27.6 33 30 30 31 28C31.4 30.4 32.6 31.6 33.2 31.6C33.6 31.6 32.6 29 32 26Z" fill="url(#inner-flame)"/>
</svg>